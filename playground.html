<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Playground — NVR Coding</title>
<meta name="description" content="NVR Coding — learn front-end, back-end, SQL and Git through psychology-backed lessons: chunked steps, active recall, spaced review, and write-it exercises.">
<meta name="theme-color" content="#0f1420">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">🧠 NVR<span>Coding</span></a>
  <div class="pills">
    <a class="pill" href="playground.html" style="text-decoration:none;color:inherit">🧪 Playground</a>
    <a class="pill" href="review.html" style="text-decoration:none;color:inherit">🔁 Review</a>
    <button class="pill" id="themeBtn" style="cursor:pointer">🌙</button><span class="pill">⚡ <b id="xpPill">0</b> XP</span>
    <span class="pill">🔥 <b id="streakPill">0</b></span>
  </div>
</header>

<main class="lesson-shell">
  <h1 style="margin-bottom:6px">🧪 Playground</h1>
  <p class="tiny" style="margin-bottom:20px">Your personal sandbox. No rules, no grades — just play. Experimenting is how coders are made.</p>
  <article class="lesson-card">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button class="btn ghost" data-tpl="hello">👋 Hello template</button>
      <button class="btn ghost" data-tpl="loop">🔁 For loop</button>
      <button class="btn ghost" data-tpl="math">🧮 Math</button>
    </div>
    <textarea class="code-editor" id="editor" spellcheck="false" style="min-height:220px">console.log("Play with me!");</textarea>
    <button class="btn primary" id="runBtn">▶ Run</button>
    <pre class="console" id="out">Output will appear here…</pre>
  </article>
</main>

<script src="data/lessons.js"></script>
<script src="js/celebrate.js"></script>
<script src="js/app.js"></script>
<script src="js/playground.js"></script>
</body>
</html>
